services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    volumes:
      - memory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./tests:/app/tests
      - ./fixtures:/app/fixtures
    environment:
      DATABASE_URL: postgresql+asyncpg://memory:memory@db:5432/memory
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MEMORY_AUTH_TOKEN: ${MEMORY_AUTH_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  memory_db_data:
